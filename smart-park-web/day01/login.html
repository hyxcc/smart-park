<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧园区管理系统登录</title>
</head>
<body>
<main>

    <header>
        <h1>智慧园区管理系统登录</h1>
    </header>

    <form action="login.html" method="post">
        <label for="parkCode">园区编号</label>
        <input type="text" id="parkCode" name="parkCode" required minlength="4" maxlength="12" placeholder="请输入园区编号 例如 PARK-001"
               pattern="[A-Za-z0-9\-]{4,12}">
        <br>
        <!-- 用户名字段 -->
        <label for="username" >用户名</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username">
        <br>
        <!-- 密码字段 -->
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="current-password">
        <br>
        <!-- 记住登录复选框 -->
        <label for="remember">记住登录</label>
        <input type="checkbox" id="remember" name="remember">
        <!-- 提交按钮 -->
        <button type="submit">登录</button>
        <!-- Loading 状态 -->
        <p role="status" aria-live="polite" hidden>
            <span>正在登录，请稍候……</span>
        </p>
        <!-- 错误提示 -->
        <p role="alert" hidden>
            <span>用户名或密码错误</span>
        </p>
    </form>
</main>
</body>
</html>
